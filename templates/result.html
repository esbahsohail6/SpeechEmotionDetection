<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🔍 Audio Analysis Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">🔍 Audio Analysis Result</h2>
    
    <p><strong>Sample Rate:</strong> {{ sample_rate }} Hz</p>
    <p><strong>Duration:</strong> {{ duration }} seconds</p>
    <p><strong>Detected Emotion:</strong> <span class="badge bg-success fs-5">{{ emotion }}</span></p>


    <div class="row mt-4">
      <div class="col-md-6">
        <h5>Waveform</h5>
        <img src="{{ url_for('static', filename=waveform) }}" alt="Waveform" width="100%">
      </div>
      <div class="col-md-6">
        <h5>Spectrogram</h5>
        <img src="{{ url_for('static', filename=spectrogram) }}" alt="Spectrogram" width="100%">
      </div>
    </div>
    
    <div class="text-center mt-4">
      <a href="/" class="btn btn-secondary">🔙 Go Back</a>
    </div>
  </div>
</body>
</html>
