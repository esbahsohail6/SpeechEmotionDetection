<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎵 Audio Emotion Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container text-center mt-5">
    <h1 class="display-5 mb-4">🎧 Upload Your Audio File</h1>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <input class="form-control" type="file" name="audio" accept=".wav,.mp3" required>
      </div>
      <button class="btn btn-primary">Analyze Emotion</button>
    </form>
  </div>
</body>
</html>
